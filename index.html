<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Pop Culture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #eee;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 6px;
      margin-bottom: 32px;
      color: #0ff;
      text-shadow: 0 0 12px rgba(0,255,255,.4);
    }

    #card {
      background: #15151f;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      width: 400px;
      max-width: 90vw;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
      transition: transform .3s;
    }

    #card:hover {
      transform: translateY(-2px);
    }

    #image-container {
      width: 100%;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d14;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }

    #image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      transition: opacity .4s;
    }

    #image-container .placeholder {
      color: #333;
      font-size: 3rem;
    }

    #spinner {
      display: none;
      width: 40px;
      height: 40px;
      border: 3px solid #222;
      border-top-color: #0ff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      position: absolute;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #name {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #fff;
    }

    #category {
      font-size: .8rem;
      color: #0ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      opacity: .7;
    }

    #description {
      font-size: .85rem;
      color: #888;
      line-height: 1.5;
      margin-bottom: 16px;
      max-height: 4.5em;
      overflow: hidden;
    }

    #wiki-link {
      display: inline-block;
      font-size: .75rem;
      color: #555;
      text-decoration: none;
      margin-bottom: 8px;
      transition: color .2s;
    }

    #wiki-link:hover { color: #0ff; }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: center;
    }

    button {
      padding: 12px 32px;
      background: transparent;
      color: #0ff;
      border: 1px solid #0ff;
      font-family: inherit;
      font-size: .9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 8px;
      transition: background .2s, color .2s, box-shadow .2s;
    }

    button:hover {
      background: #0ff;
      color: #0a0a0f;
      box-shadow: 0 0 20px rgba(0,255,255,.3);
    }

    button:active {
      transform: scale(.97);
    }

    #counter {
      margin-top: 20px;
      font-size: .75rem;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Random Pop Culture</h1>

  <div id="card">
    <div id="image-container">
      <div id="spinner"></div>
      <img id="photo" src="" alt="" style="display:none">
      <div class="placeholder" id="placeholder">?</div>
    </div>
    <div id="category"></div>
    <div id="name"></div>
    <div id="description"></div>
    <a id="wiki-link" href="#" target="_blank" rel="noopener"></a>
  </div>

  <div class="buttons">
    <button id="btn">Next</button>
  </div>
  <div id="counter"></div>

    const photo = document.getElementById('photo');
    const placeholder = document.getElementById('placeholder');
    const spinner = document.getElementById('spinner');
    const nameEl = document.getElementById('name');
    const catEl = document.getElementById('category');
    const descEl = document.getElementById('description');
    const wikiLink = document.getElementById('wiki-link');
    const counterEl = document.getElementById('counter');

    let seen = 0;

    async function fetchWiki(wikiTitle) {
      const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiTitle)}`;
      const res = await fetch(url);
      if (!res.ok) return null;
      return res.json();
    }

    async function next() {
      // UI loading state
      photo.style.display = 'none';
      placeholder.style.display = 'none';
      spinner.style.display = 'block';
      nameEl.textContent = '';
      catEl.textContent = '';
      descEl.textContent = '';
      wikiLink.href = '#';
      wikiLink.textContent = '';

      const char = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
      seen++;

      try {
        const data = await fetchWiki(char.wiki);

        if (data && data.thumbnail) {
          // Use originalimage if available for higher res, otherwise thumbnail
          const imgUrl = (data.originalimage && data.originalimage.source)
            ? data.originalimage.source
            : data.thumbnail.source;
          photo.src = imgUrl;
          photo.alt = char.name;
          photo.onload = () => {
            spinner.style.display = 'none';
            photo.style.display = 'block';
          };
          photo.onerror = () => {
            spinner.style.display = 'none';
            placeholder.textContent = char.name[0];
            placeholder.style.display = 'block';
          };
        } else {
          spinner.style.display = 'none';
          placeholder.textContent = char.name[0];
          placeholder.style.display = 'block';
        }

        catEl.textContent = char.cat;
        nameEl.textContent = char.name;
        descEl.textContent = data && data.extract ? data.extract : '';
        if (data && data.content_urls) {
          wikiLink.href = data.content_urls.desktop.page;
          wikiLink.textContent = 'Wikipedia →';
        }
      } catch (e) {
        spinner.style.display = 'none';
        placeholder.textContent = '!';
        placeholder.style.display = 'block';
        catEl.textContent = char.cat;
        nameEl.textContent = char.name;
        descEl.textContent = 'Impossible de charger les données.';
      }

      counterEl.textContent = `${seen} / ${CHARACTERS.length} personnages`;
    }

    document.getElementById('btn').addEventListener('click', next);
    document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); next(); } });

    next();
